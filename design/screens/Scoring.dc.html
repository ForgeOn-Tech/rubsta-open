<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
    :root{
      --bg0:#f6f8fb; --bg1:#ffffff; --bg2:#eef2f6; --line:#dce2e8;
      --ink:#0b1620; --muted:#46586a; --dim:#5e7082;
      --accent:#2f698e; --accent-fg:#ffffff; --accent-deep:#1c587c;
      --good:#2e7d55; --warn:#8a6200; --bad:#b23a3a;
      --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    }
    *,*::before,*::after{box-sizing:border-box;border-radius:0;}
    body{margin:0;font-family:var(--sans);background:var(--bg0);color:var(--ink);-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent-deep);}
    .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
    .caps{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);}
    .thead{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);}
    .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg0);display:flex;flex-direction:column;overflow:hidden;">
  <div style="background:var(--bg1);border-bottom:1px solid var(--line);padding:18px 20px 16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div style="display:flex;align-items:center;gap:10px;color:var(--muted);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          <span class="eyebrow">Court 1 · M21</span></div><span class="mono" style="font-size:10px;color:var(--good);">SYNCED 2s</span>
      </div>
      <div style="font-size:20px;font-weight:600;letter-spacing:-.01em;margin-top:12px;">Men's singles · R16</div>
    </div>
  <div style="padding:16px 20px 0;">
    <div style="background:var(--bg1);border:1px solid var(--line);padding:4px 16px 0;">
      <div style="display:flex;justify-content:flex-end;gap:11px;padding:9px 0 6px;">
        <span class="thead" style="width:30px;text-align:center;">S1</span>
        <span class="thead" style="width:30px;text-align:center;">S2</span>
        <span class="thead" style="width:44px;text-align:right;">PTS</span>
      </div>
      <div style="display:flex;align-items:center;gap:11px;height:56px;border-bottom:1px solid var(--line);"><span style="width:7px;height:7px;background:var(--accent);"></span><span class="mono" style="font-size:10px;color:var(--dim);width:12px;">3</span><span style="flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Y. Malhotra</span><span class="mono" style="width:30px;text-align:center;font-size:20px;font-weight:600;color:var(--dim);">6</span><span class="mono" style="width:30px;text-align:center;font-size:20px;font-weight:600;color:var(--ink);">3</span><span class="mono" style="width:44px;text-align:right;font-size:26px;font-weight:600;color:var(--accent);">40</span></div>
      <div style="display:flex;align-items:center;gap:11px;height:56px;border-bottom:1px solid var(--line);"><span style="width:7px;height:7px;"></span><span class="mono" style="font-size:10px;color:var(--dim);width:12px;"></span><span style="flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">G. Pillai</span><span class="mono" style="width:30px;text-align:center;font-size:20px;font-weight:600;color:var(--dim);">4</span><span class="mono" style="width:30px;text-align:center;font-size:20px;font-weight:600;color:var(--ink);">2</span><span class="mono" style="width:44px;text-align:right;font-size:26px;font-weight:600;color:var(--accent);">40</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;">
        <span class="mono" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);">Deuce</span>
        <span class="mono" style="font-size:11px;color:var(--dim);">1:42 ELAPSED · GAME 6</span>
      </div>
    </div>
  </div>
  <div style="flex:1;min-height:0;padding:16px 20px 0;display:flex;flex-direction:column;gap:11px;">
    <div style="height:70px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;
         justify-content:space-between;padding:0 20px;">
      <span style="font-size:16px;font-weight:600;">Point — Malhotra</span>
      <span class="mono" style="font-size:11px;letter-spacing:.08em;">SERVING</span>
    </div>
    <div style="height:70px;border:1px solid var(--line);background:var(--bg1);display:flex;align-items:center;
         padding:0 20px;"><span style="font-size:16px;font-weight:600;">Point — Pillai</span></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;"><div style="height:46px;border:1px solid var(--line);background:var(--bg1);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted);">Fault</div><div style="height:46px;border:1px solid var(--line);background:var(--bg1);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted);">Double fault</div><div style="height:46px;border:1px solid var(--line);background:var(--bg1);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted);">Let</div><div style="height:46px;border:1px solid var(--line);background:var(--bg1);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.1-5.6L3 10"/></svg>Undo</div></div>
  </div>
  <div style="padding:14px 20px 22px;background:var(--bg1);border-top:1px solid var(--line);
       display:flex;align-items:center;justify-content:space-between;">
    <span class="mono" style="font-size:11px;color:var(--muted);">CHANGE ENDS AFTER THIS GAME</span>
    <span style="font-size:12.5px;font-weight:600;color:var(--accent);">Match menu</span>
  </div></div>
</x-dc>
</body>
</html>
